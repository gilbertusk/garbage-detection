[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wastesorter"
version = "0.1.0"
description = "Klasifikasi sampah dari kamera HP, berjalan di browser"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pillow",
    "scikit-learn",
    "torch",
    "torchvision",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "onnx", "onnxruntime"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B905"]  # zip(strict=) tidak menambah nilai di sini
